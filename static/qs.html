<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OxiDesk Hızlı Destek</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-acrylic: rgba(26, 31, 44, 0.92);
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-blue: #0078d4;
      --accent-hover: #1084d8;
      --accent-green: #107c41;
      --text-main: #f3f3f3;
      --text-muted: #9aa0a6;
    }

    html.light {
      --bg-acrylic: rgba(248, 250, 252, 0.96);
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(0, 0, 0, 0.1);
      --accent-blue: #0067b8;
      --accent-hover: #0078d4;
      --text-main: #0f172a;
      --text-muted: #64748b;
    }

    html.light body {
      background: #f1f5f9;
      color: var(--text-main);
    }

    html.light .titlebar {
      background: rgba(248, 250, 252, 0.98);
      border-bottom: 1px solid var(--card-border);
    }

    html.light .titlebar-title {
      color: var(--text-main);
    }

    html.light .id-card {
      background: #ffffff;
      border: 1px solid var(--card-border);
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }

    html.light .id-display {
      color: #0067b8;
      text-shadow: none;
    }

    html.light .status-card,
    html.light .pin-box {
      background: #ffffff;
      border: 1px solid var(--card-border);
    }

    html.light .status-info h4 {
      color: var(--text-main);
    }

    html.light .win-btn:hover {
      background: rgba(0, 0, 0, 0.06);
      color: var(--text-main);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-drag: none;
    }

    body {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      background: #0f121a;
      color: var(--text-main);
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Windows 11 Custom Titlebar */
    .titlebar {
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      background: rgba(18, 22, 33, 0.95);
      border-bottom: 1px solid var(--card-border);
      -webkit-app-region: drag;
    }

    .titlebar-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .titlebar-logo {
      width: 18px;
      height: 18px;
      color: #60cdff;
    }

    .titlebar-title {
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.3px;
      color: #e0e6ed;
    }

    .titlebar-controls {
      display: flex;
      -webkit-app-region: no-drag;
    }

    .win-btn {
      width: 38px;
      height: 38px;
      border: none;
      background: transparent;
      color: #ccc;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s;
    }

    .win-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .win-btn.close:hover {
      background: #e81123;
      color: #fff;
    }

    /* Content Area */
    .container {
      flex: 1;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      background: radial-gradient(circle at top right, rgba(0, 120, 212, 0.12), transparent 70%),
                  radial-gradient(circle at bottom left, rgba(16, 124, 65, 0.08), transparent 70%);
    }

    /* Status Banner */
    .status-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      backdrop-filter: blur(20px);
    }

    .pulse-ring {
      width: 12px;
      height: 12px;
      background: #4cc2ff;
      border-radius: 50%;
      position: relative;
    }

    .pulse-ring::after {
      content: '';
      position: absolute;
      top: -4px;
      left: -4px;
      right: -4px;
      bottom: -4px;
      border: 2px solid #4cc2ff;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.6); opacity: 1; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    .status-info h4 {
      font-size: 0.85rem;
      font-weight: 600;
      color: #fff;
    }

    .status-info p {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Main ID Card */
    .id-card {
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.02));
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }

    .id-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .id-display {
      font-family: 'Segoe UI', monospace;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: #60cdff;
      text-shadow: 0 0 16px rgba(96, 205, 255, 0.35);
      margin-bottom: 12px;
    }

    .id-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .btn {
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--accent-blue);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      box-shadow: 0 0 12px rgba(0, 120, 212, 0.5);
    }

    /* PIN Box */
    .pin-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .pin-label {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .pin-val {
      font-family: monospace;
      font-size: 1.2rem;
      font-weight: 700;
      color: #ffd43b;
      letter-spacing: 2px;
    }

    /* Footer Info */
    .footer-info {
      margin-top: auto;
      font-size: 0.72rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      border-top: 1px solid var(--card-border);
      padding-top: 12px;
    }
  </style>
</head>
<body>

  <!-- Windows Titlebar -->
  <header class="titlebar">
    <div class="titlebar-left">
      <svg class="titlebar-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
      </svg>
      <span class="titlebar-title">OxiDesk Hızlı Destek</span>
    </div>
    <div class="titlebar-controls" style="display:flex; align-items:center; -webkit-app-region: no-drag;">
      <!-- Tema Değiştirici -->
      <button class="win-btn" onclick="toggleTheme()" title="Açık / Koyu Tema" style="width:32px;height:32px;">
        <svg id="qs-sun-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        <svg id="qs-moon-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      </button>
      <button class="win-btn" onclick="windowMinimize()" title="Simge Durumuna Küçült">
        <svg width="10" height="1" viewBox="0 0 10 1"><path fill="currentColor" d="M0 0h10v1H0z"/></svg>
      </button>
      <button class="win-btn" onclick="windowMaximize()" title="Ekranı Kapla / Geri Yükle">
        <svg width="10" height="10" viewBox="0 0 10 10"><path fill="none" stroke="currentColor" stroke-width="1.2" d="M0.5 0.5h9v9h-9z"/></svg>
      </button>
      <button class="win-btn close" onclick="windowClose()" title="Kapat">
        <svg width="10" height="10" viewBox="0 0 10 10"><path fill="currentColor" d="M0 0l5 5-5 5 1 1 5-5 5 5 1-1-5-5 5-5-1-1-5 5-5-5-1 1z"/></svg>
      </button>
    </div>
  </header>

  <!-- Container -->
  <div class="container">
    <div class="status-card">
      <div class="pulse-ring"></div>
      <div class="status-info">
        <h4>Destek Ağına Bağlı</h4>
        <p>Bilgi İşlem bu bilgisayarı otomatik görebilir</p>
      </div>
    </div>

    <!-- ID Card -->
    <div class="id-card">
      <div class="id-label">Bu Cihazın Bağlantı Kimliği</div>
      <div class="id-display" id="device-id">Yükleniyor...</div>
      <div class="id-actions">
        <button class="btn btn-primary" onclick="copyId()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          <span id="copy-text">Kimliği Kopyala</span>
        </button>
      </div>
    </div>

    <!-- PIN Box -->
    <div class="pin-box">
      <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
        <div>
          <span class="pin-label">Tek Kullanımlık Geçici PIN</span>
          <div class="pin-val" id="pin-val">----</div>
        </div>
        <button class="btn btn-secondary" onclick="refreshPin()" title="Yeni Tek Kullanımlık PIN Üret" style="padding: 6px 12px; font-size: 0.8rem; background: rgba(255,255,255,0.08); border-radius: 6px;">
          🔄 Yenile
        </button>
      </div>
    </div>

    <!-- Live Chat Drawer Toggle Button -->
    <button class="btn btn-primary" onclick="toggleQsChat()" style="width: 100%; justify-content: center; gap: 8px;">
      💬 IT Uzmanı ile Canlı Sohbet <span id="qs-chat-badge" style="display:none; background:#ef4444; color:#fff; border-radius:10px; padding:1px 6px; font-size:0.7rem;">1</span>
    </button>

    <!-- Collapsible Chat Drawer -->
    <div id="qs-chat-drawer" style="display: none; flex-direction: column; height: 160px; background: rgba(0,0,0,0.3); border: 1px solid var(--card-border); border-radius: 8px; overflow: hidden; padding: 8px; gap: 6px;">
      <div id="qs-chat-messages" style="flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; font-size: 0.78rem;">
        <div style="color: var(--text-muted); text-align: center; font-size: 0.7rem;">Bağlantı kurulduğunda buradan mesajlaşabilirsiniz.</div>
      </div>
      <div style="display: flex; gap: 6px;">
        <input type="text" id="qs-chat-input" placeholder="Cevap yazın..." style="flex:1; padding: 5px 8px; border-radius: 4px; border: 1px solid var(--card-border); background: rgba(255,255,255,0.06); color: var(--text-main); font-size: 0.78rem;" onkeydown="if(event.key==='Enter') sendQsChatMessage()">
        <button class="btn btn-primary" onclick="sendQsChatMessage()" style="padding: 4px 10px; font-size: 0.75rem;">Gönder</button>
      </div>
    </div>

    <!-- Device Details -->
    <div class="footer-info">
      <span id="hostname-display">Cihaz: ...</span>
      <span id="ip-display">Port: ...</span>
    </div>
  </div>

  <script>
    let myHostname = 'Kullanıcı';
    let lastChatCount = 0;

    async function loadInfo() {
      try {
        const res = await fetch('/api/info');
        const data = await res.json();
        
        myHostname = data.hostname || 'Kullanıcı';
        const id = data.device_id || '---';
        const formatted = id.length === 9 ? `${id.slice(0,3)} ${id.slice(3,6)} ${id.slice(6,9)}` : id;
        
        document.getElementById('device-id').innerText = formatted;
        document.getElementById('pin-val').innerText = data.pin || '----';
        document.getElementById('hostname-display').innerText = 'Cihaz: ' + (data.hostname || 'PC');
        document.getElementById('ip-display').innerText = 'Port: ' + (data.port || 8080);
      } catch (e) {
        console.error(e);
      }
    }

    async function refreshPin() {
      try {
        const res = await fetch('/api/pin/refresh');
        if (res.ok) {
          const data = await res.json();
          document.getElementById('pin-val').innerText = data.new_pin;
        }
      } catch (e) {
        console.error(e);
      }
    }

    function copyId() {
      const rawText = document.getElementById('device-id').innerText.replace(/\s+/g, '');
      navigator.clipboard.writeText(rawText);
      const span = document.getElementById('copy-text');
      span.innerText = 'Kopyalandı!';
      setTimeout(() => span.innerText = 'Kimliği Kopyala', 2000);
    }

    // Chat Drawer Handling
    function toggleQsChat() {
      const drawer = document.getElementById('qs-chat-drawer');
      if (!drawer) return;
      const isHidden = drawer.style.display === 'none';
      drawer.style.display = isHidden ? 'flex' : 'none';
      if (isHidden) {
        document.getElementById('qs-chat-badge').style.display = 'none';
        document.getElementById('qs-chat-input').focus();
        fetchChatMessages();
      }
    }

    async function sendQsChatMessage() {
      const input = document.getElementById('qs-chat-input');
      const text = input.value.trim();
      if (!text) return;

      try {
        await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sender: myHostname, text })
        });
        input.value = '';
        fetchChatMessages();
      } catch (e) {}
    }

    async function fetchChatMessages() {
      try {
        const res = await fetch('/api/chat');
        if (!res.ok) return;
        const messages = await res.json();
        const container = document.getElementById('qs-chat-messages');
        const badge = document.getElementById('qs-chat-badge');
        const drawer = document.getElementById('qs-chat-drawer');

        if (messages.length > lastChatCount && drawer.style.display === 'none') {
          badge.style.display = 'inline-block';
          badge.innerText = messages.length - lastChatCount;
        }
        lastChatCount = messages.length;

        if (container && messages.length > 0) {
          container.innerHTML = messages.map(m => {
            const isMine = m.sender === myHostname;
            return `
              <div style="align-self: ${isMine ? 'flex-end' : 'flex-start'}; background: ${isMine ? '#0078d4' : 'rgba(255,255,255,0.1)'}; padding: 4px 8px; border-radius: 6px; max-width: 85%;">
                <div style="font-size:0.65rem; opacity:0.8;">${escapeHtml(m.sender)}</div>
                <div>${escapeHtml(m.text)}</div>
              </div>
            `;
          }).join('');
          container.scrollTop = container.scrollHeight;
        }
      } catch (e) {}
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // Theme Handling
    function initTheme() {
      const savedTheme = localStorage.getItem('oxidesk_theme') || localStorage.getItem('apex_theme') || 'dark';
      applyTheme(savedTheme);
    }

    function applyTheme(theme) {
      const html = document.documentElement;
      const sun = document.getElementById('qs-sun-icon');
      const moon = document.getElementById('qs-moon-icon');
      if (theme === 'light') {
        html.classList.remove('dark');
        html.classList.add('light');
        localStorage.setItem('oxidesk_theme', 'light');
        if (sun) sun.style.display = 'none';
        if (moon) moon.style.display = 'block';
      } else {
        html.classList.remove('light');
        html.classList.add('dark');
        localStorage.setItem('oxidesk_theme', 'dark');
        if (sun) sun.style.display = 'block';
        if (moon) moon.style.display = 'none';
      }
    }

    function toggleTheme() {
      const isLight = document.documentElement.classList.contains('light');
      applyTheme(isLight ? 'dark' : 'light');
    }

    function windowMinimize() {
      if (window.ipc) window.ipc.postMessage('minimize');
      else fetch('/api/window/minimize', { method: 'POST' }).catch(() => {});
    }

    function windowMaximize() {
      if (window.ipc) window.ipc.postMessage('maximize');
      else fetch('/api/window/maximize', { method: 'POST' }).catch(() => {});
    }

    function windowClose() {
      if (window.ipc) window.ipc.postMessage('close');
      else {
        fetch('/api/window/close', { method: 'POST' }).catch(() => {});
        window.close();
      }
    }

    // Titlebar Drag support
    document.addEventListener('DOMContentLoaded', () => {
      const titlebar = document.querySelector('.titlebar');
      if (titlebar) {
        titlebar.addEventListener('mousedown', (e) => {
          if (e.target.closest('button')) return;
          if (window.ipc) window.ipc.postMessage('drag');
        });
      }
    });

    initTheme();
    loadInfo();
    setInterval(loadInfo, 3000);
    setInterval(fetchChatMessages, 2000);
  </script>
</body>
</html>
