[package]
name = "oxidesk"
version = "2.0.0"
edition = "2021"

[lib]
name = "oxidesk"
path = "src/lib.rs"

[[bin]]
name = "oxidesk"
path = "src/main.rs"

[[bin]]
name = "oxidesk_qs"
path = "src/bin/quicksupport.rs"

[[bin]]
name = "oxidesk_rendezvous"
path = "src/bin/rendezvous.rs"

[[bin]]
name = "oxidesk_service"
path = "src/bin/service.rs"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rust-embed = "8.5"
jpeg-encoder = "0.6"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
aes-gcm = "0.10"
sha2 = "0.10"
base64 = "0.22"
tokio-tungstenite = { version = "0.23", features = ["handshake"] }
jpeg-decoder = "0.3"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader"
] }
wry = "0.47"
tao = "0.30"
